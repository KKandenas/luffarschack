<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <title>Boardgame</title>
    <meta name="description" content="Boardgames - spela brädspel mot en kompis, varsin mobil, i realtid.">
    <meta name="theme-color" content="#0b0c10">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon.svg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="style.css?v=48">
</head>
<body>
    <div id="app">

        <section class="screen" id="screen-profile">
            <div class="card center">
                <h1>Vem spelar?</h1>
                <p class="subtitle">Välj din profil, eller skapa en ny.</p>
                <input id="profile-search" type="text" class="profile-search-input hidden" placeholder="Sök profil…" autocomplete="off">
                <div id="profile-list" class="profile-list"></div>
                <form id="form-profile-new" class="profile-new-form">
                    <label class="field">
                        <span>Nytt namn</span>
                        <input id="profile-new-name" type="text" maxlength="20" placeholder="Ditt namn" autocomplete="off">
                    </label>
                    <p class="error-text" id="profile-error"></p>
                    <button type="submit" class="btn btn-secondary">Skapa profil</button>
                </form>
            </div>
        </section>

        <section class="screen" id="screen-home">
            <div class="card center">
                <div class="brand-row">
                    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
                        <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="#5eead4" stroke-width="2"/>
                        <circle cx="16" cy="16" r="4.5" fill="#5eead4"/>
                    </svg>
                    <h1>Bordsspel</h1>
                </div>
                <p class="subtitle">Brädspel mot en kompis — varsin mobil, i realtid.</p>
                <p class="profile-chip">Spelar som <strong id="home-profile-name">–</strong> · <button type="button" id="btn-switch-profile" class="link-btn">byt profil</button></p>

                <div id="open-rooms-section" class="open-rooms-section hidden">
                    <p class="section-label">Öppna spel</p>
                    <div id="open-rooms-list" class="open-rooms-list"></div>
                </div>

                <p class="section-label">Starta ett spel</p>
                <div class="game-picker" id="start-game-picker">
                    <button type="button" class="game-card" data-game-id="tictactoe">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#20232f"/><path d="M18 8v32M30 8v32M8 18h32M8 30h32" stroke="#454a5c" stroke-width="2" stroke-linecap="round"/><path d="M11 11l6 6M17 11l-6 6" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round"/><circle cx="37" cy="37" r="4.5" fill="none" stroke="#f472b6" stroke-width="2.5"/></svg></span>
                        <span class="game-name">Luffarschack</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="othello">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#14532d"/><circle cx="19" cy="19" r="6" fill="#16171c"/><circle cx="29" cy="19" r="6" fill="#f4f4f5"/><circle cx="19" cy="29" r="6" fill="#f4f4f5"/><circle cx="29" cy="29" r="6" fill="#16171c"/></svg></span>
                        <span class="game-name">Othello</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="backgammon">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#3a2a18"/><path d="M8 40 14 12 20 40Z" fill="#6b4a2c"/><path d="M20 40 26 12 32 40Z" fill="#4a3220"/><path d="M32 40 38 12 44 40Z" fill="#6b4a2c"/><circle cx="14" cy="35" r="4.5" fill="#0c0d10" stroke="#000"/><circle cx="14" cy="26" r="4.5" fill="#fbfbf9" stroke="#b8b8ae"/></svg></span>
                        <span class="game-name">Backgammon</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="battleship">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#123a63"/><path d="M8 8h32M8 18h32M8 28h32M8 38h32M8 8v32M18 8v32M28 8v32M38 8v32" stroke="#0a2038"/><rect x="10" y="21" width="26" height="6" rx="3" fill="#8fa8c2"/><circle cx="32" cy="14" r="4" fill="#f87171"/></svg></span>
                        <span class="game-name">Sänka skepp</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="connectfour">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#1e3a67"/><circle cx="14" cy="34" r="5" fill="#facc15"/><circle cx="14" cy="22" r="5" fill="#0b0c10"/><circle cx="24" cy="34" r="5" fill="#dc2626"/><circle cx="24" cy="22" r="5" fill="#dc2626"/><circle cx="34" cy="34" r="5" fill="#facc15"/><circle cx="34" cy="22" r="5" fill="#0b0c10"/></svg></span>
                        <span class="game-name">4 i rad</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="checkers">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#6b4a2f"/><rect x="8" y="8" width="10" height="10" fill="#e8d9b5"/><rect x="28" y="8" width="10" height="10" fill="#e8d9b5"/><rect x="18" y="18" width="10" height="10" fill="#e8d9b5"/><rect x="8" y="28" width="10" height="10" fill="#e8d9b5"/><rect x="28" y="28" width="10" height="10" fill="#e8d9b5"/><circle cx="23" cy="23" r="5.5" fill="#0c0d10" stroke="#000"/></svg></span>
                        <span class="game-name">Dam</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="go">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#dcb35c"/><path d="M8 18h32M8 30h32M18 8v32M30 8v32" stroke="#8a5a1f" stroke-width="1.5"/><circle cx="18" cy="18" r="6" fill="#0c0d10" stroke="#000"/><circle cx="30" cy="30" r="6" fill="#fbfbf9" stroke="#b8b8ae"/></svg></span>
                        <span class="game-name">Go</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="kvarn">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#d8d2c4"/><g stroke="#3a362c" stroke-width="1.5" fill="none"><rect x="7" y="7" width="34" height="34"/><rect x="14" y="14" width="20" height="20"/><rect x="21" y="21" width="6" height="6"/><path d="M24 7v14M24 27v14M7 24h14M27 24h14"/></g><circle cx="7" cy="24" r="3.2" fill="#0c0d10"/><circle cx="41" cy="24" r="3.2" fill="#fbfbf9" stroke="#b8b8ae"/></svg></span>
                        <span class="game-name">Kvarn</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="hex">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#1f2230"/><polygon points="24,6 31.79,10.5 31.79,19.5 24,24 16.21,19.5 16.21,10.5" fill="#5eead4"/><polygon points="16,20 23.79,24.5 23.79,33.5 16,38 8.21,33.5 8.21,24.5" fill="#0c0d10" stroke="#454a5c"/><polygon points="32,20 39.79,24.5 39.79,33.5 32,38 24.21,33.5 24.21,24.5" fill="#fbfbf9" stroke="#b8b8ae"/></svg></span>
                        <span class="game-name">Hex</span>
                    </button>
                    <button type="button" class="game-card" data-game-id="abalone">
                        <span class="game-icon" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#1f2230"/><g fill="#2a2e3f"><polygon points="16,6 23.79,10.5 23.79,19.5 16,24 8.21,19.5 8.21,10.5"/><polygon points="32,6 39.79,10.5 39.79,19.5 32,24 24.21,19.5 24.21,10.5"/><polygon points="24,20 31.79,24.5 31.79,33.5 24,38 16.21,33.5 16.21,24.5"/></g><circle cx="16" cy="15" r="6" fill="#0c0d10" stroke="#6b6b74"/><circle cx="32" cy="15" r="6" fill="#fbfbf9" stroke="#b8b8ae"/><circle cx="24" cy="29" r="6" fill="#0c0d10" stroke="#6b6b74"/></svg></span>
                        <span class="game-name">Abalone</span>
                    </button>
                </div>
                <p class="error-text" id="home-error"></p>

                <button type="button" id="btn-toggle-join-code" class="link-btn join-code-toggle">Har du en rumskod?</button>
                <form id="form-join" class="join-code-form hidden">
                    <label class="field">
                        <span>Rumskod</span>
                        <input id="join-code" type="text" maxlength="4" placeholder="ABCD" autocomplete="off"
                               autocapitalize="characters" class="code-input" inputmode="text">
                    </label>
                    <p class="error-text" id="join-error"></p>
                    <button type="submit" class="btn btn-secondary">Gå med</button>
                </form>

                <div class="home-footer-row">
                    <button id="btn-show-rules" class="btn btn-ghost">Regler</button>
                    <button id="btn-show-stats" class="btn btn-ghost hidden">Statistik</button>
                </div>
            </div>
        </section>

        <section class="screen" id="screen-lobby">
            <div class="card center">
                <h2>Rumskod</h2>
                <div id="lobby-code" class="room-code">----</div>
                <div class="button-row">
                    <button id="btn-copy-link" class="btn btn-secondary">Kopiera länk</button>
                    <button id="btn-share-link" class="btn btn-secondary hidden">Dela</button>
                </div>
                <p id="lobby-status" class="status-text">
                    <span class="spinner" aria-hidden="true"></span>
                    Väntar på motståndare…
                </p>
                <button id="btn-lobby-cancel" class="btn btn-ghost">Avbryt</button>
            </div>
        </section>

        <section class="screen" id="screen-game">
            <div class="game-wrap">
                <div class="topbar">
                    <button id="btn-leave-game" class="icon-btn" aria-label="Lämna spelet">✕</button>
                    <div id="round-indicator" class="round-indicator">Runda 1</div>
                    <button id="btn-show-game-rules" class="icon-btn" aria-label="Regler">?</button>
                </div>

                <div class="scorebar" id="scorebar">
                    <div id="chip-me" class="player-chip">
                        <span id="chip-me-symbol" class="chip-symbol">X</span>
                        <span id="chip-me-name" class="chip-name">Du</span>
                        <span id="chip-me-score" class="chip-score">0</span>
                    </div>
                    <div class="vs">–</div>
                    <div id="chip-opp" class="player-chip">
                        <span id="chip-opp-symbol" class="chip-symbol">O</span>
                        <span id="chip-opp-name" class="chip-name">Motståndare</span>
                        <span id="chip-opp-score" class="chip-score">0</span>
                    </div>
                </div>

                <p id="connection-banner" class="connection-banner hidden"></p>

                <div id="board" class="board"></div>

                <p id="game-status" class="status-text">Din tur</p>
                <button id="btn-play-again" class="btn btn-primary hidden">Spela igen</button>
            </div>
        </section>

        <section class="screen" id="screen-stats">
            <div class="card">
                <div class="topbar">
                    <button id="btn-stats-back" class="icon-btn" aria-label="Tillbaka">✕</button>
                    <h2>Statistik</h2>
                </div>
                <div class="stats-filters">
                    <label class="field">
                        <span>Spel</span>
                        <select id="stats-game"></select>
                    </label>
                    <label class="field">
                        <span>Tidsperiod</span>
                        <select id="stats-timeframe">
                            <option value="today">Idag</option>
                            <option value="week">Senaste veckan</option>
                            <option value="month">Senaste månaden</option>
                            <option value="year">Senaste året</option>
                            <option value="all" selected>Totalt</option>
                        </select>
                    </label>
                    <label class="field">
                        <span>Motståndare</span>
                        <select id="stats-opponent">
                            <option value="all" selected>Alla (topplista)</option>
                        </select>
                    </label>
                </div>
                <div id="stats-results" class="stats-results"></div>
            </div>
        </section>

        <section class="screen" id="screen-rules">
            <div class="card">
                <div class="topbar">
                    <button id="btn-rules-back" class="icon-btn" aria-label="Tillbaka">✕</button>
                    <h2>Regler</h2>
                </div>
                <label class="field">
                    <span>Spel</span>
                    <select id="rules-game"></select>
                </label>
                <div id="rules-content" class="rules-content"></div>
            </div>
        </section>

    </div>

    <div id="app-version" class="app-version"></div>

    <script type="module" src="js/main.js?v=48"></script>
</body>
</html>
